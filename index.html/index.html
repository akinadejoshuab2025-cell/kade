<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KADE - Graphics & Prints</title>
<style>
body{ background:#0d0d0d; color:white; font-family:Arial; text-align:center; padding:10px; }
h1{ color:#a855f7; }
.card, .box{ background:#1a1a1a; border:2px solid #a855f7; border-radius:15px; padding:12px; margin:10px 0; text-align:left; }
button{ background:#a855f7; color:white; border:none; padding:12px 18px; border-radius:20px; font-weight:bold; margin:3px; }
input, select{ padding:10px; width:90%; margin:5px; border-radius:10px; border:none; }
.secureBadge{ background:green; padding:5px 10px; border-radius:10px; font-size:12px; }
</style>
</head>
<body>

<h1>🎨 KADE</h1>
<p>Graphics & Prints | <span class="secureBadge">🔒 Secured • v2.1</span></p>

<div id="loginBox" class="box" style="text-align:center;">
  <h3>🔐 Login</h3>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="pass" placeholder="Password - any password works">
  <br><label><input type="checkbox" id="privacy" style="width:auto;"> I agree to KADE Privacy Policy</label>
  <br><br><button onclick="login()">Login</button>
  <p id="loginMsg"></p>
</div>

<div id="menu" style="display:none; text-align:center;">
  <button onclick="showPage('shop')">🛍️ Shop</button>
  <button onclick="showPage('admin')">🔒 My Admin</button>
  <button onclick="logout()" style="background:#333;">Logout</button>
</div>

<div id="shop" style="display:none;">
  <div class="card"><h3>🖼️ Frame</h3><button onclick="add('Frame')">Add</button></div>
  <div class="card"><h3>📚 Book Publishing</h3><button onclick="add('Book Publishing')">Add</button></div>
  <div class="card"><h3>✨ Customizing</h3><button onclick="add('Customizing')">Add</button></div>
  <div class="card"><h3>🎯 Branding</h3><button onclick="add('Branding')">Add</button></div>
  <div class="card"><h3>📖 Book Finishing</h3><button onclick="add('Book Finishing')">Add</button></div>
  <div class="card"><h3>📕 Binding</h3><button onclick="add('Binding')">Add</button></div>
  <h3>Cart:</h3><p id="cart">Nothing yet</p>
  <button onclick="order()">📲 Chat KADE to Negotiate</button>
</div>

<div id="admin" style="display:none;">
  <div class="box" style="text-align:center;"><h3>🔒 Admin</h3><input type="password" id="adminPin" placeholder="Admin PIN"><br><button onclick="adminLogin()">Enter Admin</button><p id="adminMsg"></p></div>
  <div id="adminPanel" style="display:none;">
    <div class="box"><h2>Total: ₦<span id="total">0</span></h2><p>Orders: <span id="count">0</span></p></div>
    <div class="box"><input type="text" id="cust" placeholder="Customer Name"><select id="service"><option>Frame</option><option>Book Publishing</option><option>Customizing</option><option>Branding</option><option>Book Finishing</option><option>Binding</option></select><input type="number" id="amount" placeholder="Final Amount"><br><button onclick="addSale()">Add Sale ✅</button></div>
    <div class="box"><h3>📋 Sales</h3><div id="list">No sales yet</div></div>
  </div>
</div>

<script>
let items=[], sales=[], total=0;
function cleanInput(text){ return text.replace(/[<>'";--]/g, "").trim(); }

// NEW SIMPLE LOGIN - NO STRONG PASSWORD, NO MFA
function login(){
  let u = cleanInput(document.getElementById("username").value);
  let p = document.getElementById("pass").value;
  let a = document.getElementById("privacy").checked;
  if(!a){ alert("You must agree to Privacy Policy"); return; }
  if(!u || !p){ alert("Enter username and password"); return; }
  document.getElementById("loginMsg").innerText = "Welcome " + u;
  document.getElementById("loginBox").style.display="none";
  document.getElementById("menu").style.display="block";
  showPage('shop');
}
function logout(){ location.reload(); }
function showPage(page){ ['shop','admin'].forEach(id=>{ document.getElementById(id).style.display = id===page ? 'block':'none'; }); }
function adminLogin(){ if(document.getElementById("adminPin").value!=="2026"){ document.getElementById("adminMsg").innerText="❌ Wrong Admin PIN"; return; } document.getElementById("adminPanel").style.display="block"; document.getElementById("adminMsg").innerText="✅ Admin Authorised"; }
function add(product){ items.push(product); document.getElementById("cart").innerText=items.join(", "); }
function order(){ if(items.length==0){ alert("Pick service first"); return; } let msg="Hello KADE, I want: "+items.join(", ")+". Let's negotiate."; window.open("https://wa.me/2348142412575?text="+encodeURIComponent(msg)); }
function addSale(){ let cust=cleanInput(document.getElementById("cust").value); let service=document.getElementById("service").value; let amount=Number(document.getElementById("amount").value); if(!cust||!amount||amount<=0){ alert("Invalid input"); return; } sales.push({cust,service,amount}); total+=amount; document.getElementById("total").innerText=total.toLocaleString(); document.getElementById("count").innerText=sales.length; document.getElementById("list").innerHTML=sales.map(s=>`✅ ${s.cust} - ${s.service} - ₦${s.amount.toLocaleString()}<hr>`).join(""); document.getElementById("cust").value=""; document.getElementById("amount").value=""; }
</script>

</body>
</html>
